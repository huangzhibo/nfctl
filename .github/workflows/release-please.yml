name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.6.0）'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # python release-type 只改 pyproject.toml 的 version，不同步 uv.lock 里 nfctl
      # 自身条目的版本；漂移后本地 `uv sync` 会改写 lock，留下一处未提交的改动。
      # 在 release PR 分支上跑一次 `uv lock` 对齐后推回 PR（与 nf-server 一致）。
      - name: Checkout release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv
        if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@v4

      - name: Sync uv.lock with bumped version
        if: steps.release.outputs.pr
        run: uv lock

      - name: Commit uv.lock if changed
        if: steps.release.outputs.pr
        run: |
          if [[ -n "$(git status --porcelain uv.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with bumped version"
            git push
          fi

  publish:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/nfctl/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check nfctl tests
      - name: Test
        run: uv run pytest tests/ -v --tb=short
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
